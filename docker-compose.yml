version: '3.8'

services:
  # Avail Explorer Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: avail-backend
    env_file:
      - .env.production      # Override specific values for Docker internal networking
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

name: Performance Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    # Run performance tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  performance:
    name: Performance Testing
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build application
      run: npm run build
      
    - name: Setup PostgreSQL
      uses: harmon758/postgresql-action@v1
      with:
        postgresql version: '14'
        postgresql db: avail_explorer_perf
        postgresql user: postgres
        postgresql password: postgres
      
    - name: Create data directory
      run: mkdir -p ./data
      
    - name: Start server in background
      run: |
        echo "Starting server with environment:"
        echo "NODE_ENV=$NODE_ENV"
        echo "PORT=$PORT"
        echo "DATABASE_TYPE=$DATABASE_TYPE"
        echo "DATABASE_URL=$DATABASE_URL"
        npm start > server.log 2>&1 &
        echo $! > server.pid
        sleep 15  # Wait longer for server to start
        echo "Server PID: $(cat server.pid)"
        echo "Server log:"
        cat server.log || echo "No log file found"
      env:
        NODE_ENV: production
        PORT: 3001
        DATABASE_TYPE: postgresql
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avail_explorer_perf
        ENABLE_CACHING: false
        ENABLE_WEBSOCKETS: false
        ENABLE_RATE_LIMITING: false
        LOG_LEVEL: error
        
    - name: Wait for server to be ready
      run: |
        echo "Waiting for server to be ready..."
        timeout 30 bash -c 'until curl -f http://localhost:3001/health; do 
          echo "Server not ready yet, retrying in 1 second..."
          sleep 1
        done'
        echo "Server is ready!"
        echo "Health check response:"
        curl -s http://localhost:3001/health | jq . || curl -s http://localhost:3001/health
        
    - name: Debug server status if health check failed
      if: failure()
      run: |
        echo "Health check failed. Debugging server status..."
        if [ -f server.pid ]; then
          PID=$(cat server.pid)
          echo "Server PID: $PID"
          if ps -p $PID > /dev/null; then
            echo "Server process is still running"
          else
            echo "Server process has died"
          fi
        else
          echo "No server.pid file found"
        fi
        echo "Server log contents:"
        cat server.log || echo "No server log found"
        echo "Checking if port 3001 is in use:"
        netstat -tlnp | grep :3001 || echo "Port 3001 not in use"
        
    - name: Run performance tests
      run: |
        # Install artillery for load testing
        npm install -g artillery@latest
        
        # Create artillery config
        cat > artillery-config.yml << EOF
        config:
          target: 'http://localhost:3001'
          phases:
            - duration: 60
              arrivalRate: 10
              name: "Warm up"
            - duration: 120
              arrivalRate: 50
              name: "Load test"
            - duration: 60
              arrivalRate: 100
              name: "Stress test"
          processor: "./artillery-processor.js"
        scenarios:
          - name: "API Health Check"
            weight: 20
            flow:
              - get:
                  url: "/health"
          - name: "Get Latest Blocks"
            weight: 30
            flow:
              - get:
                  url: "/api/blocks"
          - name: "Search Functionality"
            weight: 25
            flow:
              - get:
                  url: "/api/search?q=1000"
          - name: "Chain Stats"
            weight: 25
            flow:
              - get:
                  url: "/api/chain/stats"
        EOF
        
        # Create processor file
        cat > artillery-processor.js << EOF
        module.exports = {
          logResponse: function(requestParams, response, context, ee, next) {
            console.log('Response status:', response.statusCode);
            return next();
          }
        };
        EOF
        
        # Run artillery test
        artillery run artillery-config.yml --output performance-report.json
        
    - name: Generate performance report
      run: |
        artillery report performance-report.json --output performance-report.html
        
        # Extract key metrics
        echo "## 📊 Performance Test Results" > performance-summary.md
        echo "" >> performance-summary.md
        
        # Parse JSON report for key metrics (simplified)
        node -e "
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('performance-report.json', 'utf8'));
          const aggregate = report.aggregate;
          
          console.log('### Key Metrics');
          console.log('- **Total Requests**: ' + (aggregate.counters?.['http.requests'] || 'N/A'));
          console.log('- **Success Rate**: ' + ((aggregate.counters?.['http.codes.200'] || 0) / (aggregate.counters?.['http.requests'] || 1) * 100).toFixed(2) + '%');
          console.log('- **Average Response Time**: ' + (aggregate.latency?.mean || 'N/A') + 'ms');
          console.log('- **95th Percentile**: ' + (aggregate.latency?.p95 || 'N/A') + 'ms');
          console.log('- **99th Percentile**: ' + (aggregate.latency?.p99 || 'N/A') + 'ms');
          console.log('- **Errors**: ' + (aggregate.counters?.['http.codes.4xx'] || 0) + ' (4xx) + ' + (aggregate.counters?.['http.codes.5xx'] || 0) + ' (5xx)');
        " >> performance-summary.md
        
    - name: Upload performance artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-results
        path: |
          performance-report.html
          performance-report.json
          performance-summary.md
        retention-days: 30
        
    - name: Comment PR with performance results
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          
          try {
            const summary = fs.readFileSync('./performance-summary.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary + '\n\n📈 Full performance report available in artifacts.'
            });
          } catch (error) {
            console.log('Could not read performance summary:', error.message);
          }
          
    - name: Stop server
      if: always()
      run: |
        if [ -f server.pid ]; then
          kill $(cat server.pid) || true
          rm server.pid
        fi 